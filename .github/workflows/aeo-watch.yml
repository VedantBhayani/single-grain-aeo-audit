name: aeo-watch

# Daily: wake the instabox machine, run the AEO watcher there, bring the results back,
# commit them to results/watch/, sync one issue per failing post, publish the dashboard to Pages.
# The work happens on the box; GitHub is the alarm clock and the noticeboard.
on:
  schedule:
    - cron: "0 15 * * *"  # daily 15:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "new = changed since last run · all = every post (continues over several runs) · since = from a date"
        type: choice
        options: [new, all, since]
        default: new
      since:
        description: "YYYY-MM-DD (for mode since, or the first run's baseline)"
        required: false

permissions: {}  # each job asks for only what it needs

concurrency:
  group: aeo-watch
  cancel-in-progress: false

env:
  BOX: aeo-watcher
  IB: npx --yes instabox@0.8.274
  INSTABOX_NO_TELEMETRY: "1"
  REPO_ON_BOX: /data/home/single-grain-aeo-audit
  # INSTABOX_API_KEY is given only to the three steps that talk to the box, never to the issues job
  # (which turns scraped text into issues) and never to the deploy job.

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # commit the run log
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Wake the box and update its copy of the repo
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        # Refuses (exit 75) while an earlier run still holds the lock, so code is never swapped under it.
        run: |
          $IB exec "$BOX" --timeout 120 -- \
            "exec 9>/data/home/aeo.lock; flock -n 9 || { echo 'an earlier watcher run is still going on the box'; exit 75; }; \
             test -d $REPO_ON_BOX/.git || git clone -q https://github.com/$GITHUB_REPOSITORY $REPO_ON_BOX; \
             cd $REPO_ON_BOX && git fetch -q && git reset -q --hard origin/$GITHUB_REF_NAME && git log --oneline -1"

      - name: Run the watcher on the box
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MODE: ${{ inputs.mode || 'new' }}
          SINCE: ${{ inputs.since }}
        run: |
          ARGS="--mode $MODE"
          if [ -n "$SINCE" ]; then
            echo "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "bad since: $SINCE"; exit 1; }
            ARGS="$ARGS --since $SINCE"
          fi
          JOB=$($IB exec --background --json "$BOX" -- "bash $REPO_ON_BOX/aeo_watch/box_run.sh $ARGS" | python -c "import sys,json;print(json.load(sys.stdin)['jobId'])")
          echo "job $JOB"
          set +e
          $IB jobs wait "$BOX" "$JOB" --timeout 100m
          CODE=$?
          set -e
          $IB jobs logs "$BOX" "$JOB" || true
          exit $CODE

      - name: Bring the results back
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          $IB cp "$BOX:/data/home/aeo-out.tgz" aeo-out.tgz
          tar xzf aeo-out.tgz
          RUN=$(date -u +%Y-%m-%dT%H%MZ)  # one folder per run, so two runs on one day don't overwrite
          mkdir -p "results/watch/$RUN" site
          cp aeo-out/run.json aeo-out/report.md "results/watch/$RUN/"
          cp aeo-out/index.html site/index.html
          cat aeo-out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the run log
        run: |
          git config user.name "aeo-watch"
          git config user.email "actions@users.noreply.github.com"
          git add results/watch/
          git diff --cached --quiet || git commit -q -m "aeo watch: run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issues
          path: aeo-out/issues.json
          retention-days: 7

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  # Its own job, so a GitHub API hiccup here can't stop the dashboard from deploying (the next run
  # catches up, because closing is worked out from all results). Only this job can write issues.
  issues:
    needs: watch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issues
          path: aeo-out
      - name: Sync issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python aeo_watch/issues.py aeo-out/issues.json

  # Pages rights live only here, in a job that never touches scraped content.
  deploy:
    needs: watch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
