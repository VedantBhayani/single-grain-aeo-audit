name: tracking-guard

# Weekly snapshot of tracking tags on singlegrain.com, singlebrain.com and clickflow.com.
# The dated report and snapshot are committed back, so the repo history is the run log.
# The job fails (and GitHub notifies the repo owner) when a tag, form or index signal disappears.
on:
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot and compare
        id: guard
        run: |
          set +e
          python tracking_guard/guard.py run
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Commit the dated report and snapshot
        run: |
          git config user.name "tracking-guard"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "tracking guard: weekly run $(date -u +%Y-%m-%d)"
          git push
      - name: Fail on alert
        if: steps.guard.outputs.exit != '0'
        run: |
          echo "Tracking signals changed since the last snapshot. See results/*/tracking/report.md"
          exit 1
